name: Update cask

on:
  schedule:
    # Daily, shortly after the app repo's release workflow could have run.
    - cron: "17 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh the cask from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-cask.sh

      - name: Commit and push if the cask changed
        run: |
          if git diff --quiet; then
            echo "Cask is already up to date."
            exit 0
          fi

          version="$(grep -m1 '^  version ' Casks/opencode-credit.rb | sed -E 's/.*"(.*)".*/\1/')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "opencode-credit ${version}"
          git push
